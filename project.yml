name: MiniClaw
options:
  bundleIdPrefix: com.neartop
  deploymentTarget:
    iOS: "16.0"
    iPadOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_OBJC_BRIDGING_HEADER: "MiniClaw/MiniClaw-Bridging-Header.h"
    ALWAYS_SEARCH_USER_PATHS: NO
    # 2026-08-12:iSH 预编译静态库(libish.a/libish_emu.a)为 iOS17 构建,链接 16.0 目标
    # 产生版本警告(第三方二进制无法重编译);-Wl,-w 抑制链接器版本噪音警告。
    OTHER_LDFLAGS:
      - "-Wl,-w"
    CODE_SIGN_STYLE: Automatic
    # --- iSH (AArch64 / asbestos) integration ---
    # C/ObjC preprocessor flags (must match how the static libs were built)
    GCC_PREPROCESSOR_DEFINITIONS:
      - "GUEST_ARM64=1"
      - "ENGINE_ASBESTOS=1"
      - "LOG_HANDLER_DPRINTF=1"
      - "ISH_ENABLED=1"
    # Swift compilation condition for #if ISH_ENABLED
    SWIFT_ACTIVE_COMPILATION_CONDITIONS:
      - "ISH_ENABLED"
    # Header search paths: iSH source root, vdso/arm64 generated headers,
    # the meson build dir (cpu-offsets.h), and our own bridge dir.
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/MiniClaw/Services/iSH"
      - "$(SRCROOT)/../第三方源码/ish-arm64"
      - "$(SRCROOT)/../第三方源码/ish-arm64/app"
      - "$(SRCROOT)/../第三方源码/ish-arm64/vdso/arm64"
      - "$(SRCROOT)/../第三方源码/ish-arm64/build-arm64-ios"
    # Link the three prebuilt iSH static libraries + sqlite3.
    OTHER_LDFLAGS:
      - "$(SRCROOT)/../第三方源码/ish-arm64/build-arm64-ios/libish.a"
      - "$(SRCROOT)/../第三方源码/ish-arm64/build-arm64-ios/libish_emu.a"
      - "$(SRCROOT)/../第三方源码/ish-arm64/build-arm64-ios/libfakefs.a"
      - "-lsqlite3"
      - "-lresolv"

targets:
  MiniClaw:
    type: application
    platform: iOS
    sources:
      - path: MiniClaw
        type: group
        excludes:
          - Resources/BundledRules
          - Resources/BundledSkills
          - AppIntents
      # AppIntents 单独编译为 Swift 5 模式：规避 iOS 26 SDK 的 AppIntent Sendable / @MainActor 严格并发冲突
      # （详见 MiniClaw/AppIntents/MiniClawIntents.swift 顶部注释）。
      - path: MiniClaw/AppIntents/MiniClawIntents.swift
        compilerFlags: "-swift-version 5"
      - path: MiniClaw/Resources/BundledRules
        type: folder
        buildPhase: resources
      - path: MiniClaw/Resources/BundledSkills
        type: folder
        buildPhase: resources
      - path: MiniClaw/Resources/BundledSubAgentProfiles
        type: folder
        buildPhase: resources
      # iSH shell-executor source (kept in 第三方源码, not copied into MiniClaw)
      # 必须用 ARC，否则 autorelease 的 NSMutableSet 等会在运行时被释放，
      # 导致 context/active-set 指针变成野指针而崩溃。
      - path: ../第三方源码/ish-arm64/app/ISHShellExecutor.m
        compilerFlags: "-fobjc-arc"
      # Prebuilt Alpine aarch64 rootfs (deployed to sandbox on first launch)
      - path: ../第三方源码/ish-arm64/rootfs
        type: folder
        buildPhase: resources
      # SwiftMath 数学字体资源(2026-08-11 闪退修复):必须进 App 主包。
      # MiniClawKit 静态合并链接,其 resources 不进 App 包 → Bundle.main
      # 找不到 mathFonts.bundle → MTFont.fontBundle 强解包崩溃。
      - path: ../第三方源码/SwiftMath/Sources/SwiftMath/mathFonts.bundle
        type: folder
        buildPhase: resources
      # Privacy Manifest（iOS 17+ 上架强制要求：声明所需理由 API + 数据收集类型）
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.neartop.miniclaw.app
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: MiniClaw/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MiniClaw/MiniClaw.entitlements
        GENERATE_INFOPLIST_FILE: NO
        # 明确指定 App 图标资源集，否则 actool 不会把 AppIcon 编进 Assets.car，
        # 也不会往 Info.plist 注入 CFBundleIconName，导致主屏图标不显示。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "MiniClaw"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchStoryboardName: ""
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - "UIInterfaceOrientationPortrait"
          - "UIInterfaceOrientationPortraitUpsideDown"
          - "UIInterfaceOrientationLandscapeLeft"
          - "UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiredDeviceCapabilities:
          - "arm64"
        INFOPLIST_KEY_UIBackgroundModes:
          - "audio"
          - "fetch"
          - "processing"
          - "remote-notification"
          - "location"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # @rpath 解析到 app 内 Frameworks(embed 的 MiniClawKit.framework)
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        # --- cmark-gfm vendored 集成(仅主 target 需要) ---
        # 传递依赖:MiniClawKit.swiftmodule 内 import cmark_gfm,MiniClaw 编译时需可解析。
        # 注意:不可用 -disable-explicit-modules(Xcode 26 driver 已移除该 flag,
        # 所有 target 都会报 Driver threw unknown argument);显式模块下 cmark_gfm
        # 通过 src/include/module.modulemap 解析(modulemap 已在 include 路径内)。
        SWIFT_INCLUDE_PATHS:
          - "$(SRCROOT)/../第三方源码/swift-cmark/src/include"
    dependencies:
      - sdk: Security.framework
      - sdk: HealthKit.framework
      - sdk: EventKit.framework
      - sdk: Photos.framework
      - sdk: CoreLocation.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
      - target: MiniClawKit
      - target: MiniClawWidget
      - target: ShareExtension
    preBuildScripts: []
    postBuildScripts: []
    # 2026-08-11 闪退修复:mathFonts.bundle 必须进 App 主包。
    # MiniClawKit 为静态合并链接(frameworks 不内嵌),挂在 Kit target 的
    # 资源不会随代码进 App 包 → Bundle.main 找不到 → MTFont.fontBundle
    # 强解包崩溃(渲染数学公式即闪退)。此处用 sources+buildPhase 显式复制
    # 进 App 主包(与本 target 其他资源一致,顶层 resources: 键不生效)。

  MiniClawKit:
    type: framework
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: MiniClawKit
        PRODUCT_BUNDLE_IDENTIFIER: com.neartop.MiniClawKit
        # 必须显式 @rpath:Xcode 默认 INSTALL_PATH=/Library/Frameworks,
        # 未设 DYLIB_INSTALL_NAME_BASE 时 install name 退化为 /Library/Frameworks/...,
        # 真机 dyld 找不到 → 启动即 SIGABRT(abort_with_payload)
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_OBJC_BRIDGING_HEADER: ""
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../第三方源码/swift-cmark/src/include"
          - "$(SRCROOT)/../第三方源码/swift-cmark/extensions"
        SWIFT_INCLUDE_PATHS:
          - "$(SRCROOT)/../第三方源码/swift-cmark/src/include"
        OTHER_LDFLAGS:
          - "-lsqlite3"
          - "-lresolv"
    sources:
      - path: ../第三方源码/MiniClawKit
        excludes:
          - KaTeX
          - .git
      # SwiftMath(原生公式渲染,vendored 1.7.3)
      - path: ../第三方源码/SwiftMath/Sources/SwiftMath
        excludes:
          - mathFonts.bundle
      # cmark-gfm C 源码(vendored,swift-cmark 0.8.0)
      - path: ../第三方源码/swift-cmark/src
        buildPhase: sources
        excludes:
          - include
          - scanners.re
          - CMakeLists.txt
          - entities.inc
          - config.h.in
          - case_fold_switch.inc
          - libcmark-gfm.pc.in
      - path: ../第三方源码/swift-cmark/extensions
        buildPhase: sources
        excludes:
          - include
          - ext_scanners.re
          - CMakeLists.txt
    resources:
      - path: ../第三方源码/MiniClawKit/KaTeX
        type: folder

  MiniClawWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MiniClawWidget
      # 共享 Live Activity 属性结构：主 App 与 Widget 扩展各编译一份（同名同字段）。
      - path: MiniClaw/Services/Background/MiniClawLiveActivityAttributes.swift
    settings:
      base:
        PRODUCT_NAME: MiniClawWidget
        PRODUCT_MODULE_NAME: MiniClawWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.neartop.miniclaw.app.widget
        INFOPLIST_FILE: MiniClawWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      # 桌面「一键任务」小组件用 AppIntentConfiguration 做可配置 prompt
      - sdk: AppIntents.framework

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_MODULE_NAME: ShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.neartop.miniclaw.app.shareext
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: UIKit.framework

  MiniClawTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MiniClawTests
    dependencies:
      - target: MiniClaw
    settings:
      base:
        PRODUCT_NAME: MiniClawTests
        PRODUCT_BUNDLE_IDENTIFIER: com.neartop.miniclaw.app.tests
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MiniClaw.app/MiniClaw"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # 让测试目标能找到主 App 编译出的 MiniClaw.swiftmodule（沙盒无签名时尤其需要显式指明）
        SWIFT_INCLUDE_PATHS: "$(BUILT_PRODUCTS_DIR)"
        INFOPLIST_FILE: MiniClawTests/Info.plist
        GENERATE_INFOPLIST_FILE: NO

schemes:
  MiniClaw:
    build:
      targets:
        MiniClaw: all
        MiniClawWidget: all
        ShareExtension: all
    test:
      targets:
        - MiniClawTests
