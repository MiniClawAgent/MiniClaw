name: MiniClawCLITools
options:
  bundleIdPrefix: com.neartop
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_HARDENED_RUNTIME: NO

targets:
  miniclaw-sessions-cli:
    type: tool
    platform: macOS
    sources:
      - path: MiniClaw/Models/ChatSession.swift
      - path: MiniClaw/Models/ChatMessage.swift
      - path: MiniClaw/Shared/HostExecutor.swift
      - path: MiniClawCLI/Common/CLICommon.swift
      - path: MiniClawCLI/SessionStore.swift
      - path: MiniClawCLI/AgentRuntime.swift
      - path: MiniClawCLI/ArtifactStore.swift
      - path: MiniClawCLI/SessionService.swift
      - path: MiniClawCLI/main.swift
    settings:
      base:
        PRODUCT_NAME: miniclaw-sessions-cli
        PRODUCT_BUNDLE_IDENTIFIER: com.neartop.miniclaw.cli.sessions

  miniclaw-fs-cli:
    type: tool
    platform: macOS
    sources:
      - path: MiniClaw/Shared/HostExecutor.swift
      - path: MiniClawCLI/Common/CLICommon.swift
      - path: MiniClawCLI/FS/main.swift
    settings:
      base:
        PRODUCT_NAME: miniclaw-fs-cli
        PRODUCT_BUNDLE_IDENTIFIER: com.neartop.miniclaw.cli.fs

  miniclaw-config-cli:
    type: tool
    platform: macOS
    sources:
      - path: MiniClaw/Shared/HostExecutor.swift
      - path: MiniClawCLI/Common/CLICommon.swift
      - path: MiniClawCLI/Config/main.swift
    settings:
      base:
        PRODUCT_NAME: miniclaw-config-cli
        PRODUCT_BUNDLE_IDENTIFIER: com.neartop.miniclaw.cli.config

  miniclaw-model-cli:
    type: tool
    platform: macOS
    sources:
      - path: MiniClawCLI/Common/CLICommon.swift
      - path: MiniClawCLI/Model/main.swift
    settings:
      base:
        PRODUCT_NAME: miniclaw-model-cli
        PRODUCT_BUNDLE_IDENTIFIER: com.neartop.miniclaw.cli.model

  miniclaw-browser-cli:
    type: tool
    platform: macOS
    sources:
      - path: MiniClaw/Shared/HostExecutor.swift
      - path: MiniClawCLI/Common/CLICommon.swift
      - path: MiniClawCLI/Browser/main.swift
    settings:
      base:
        PRODUCT_NAME: miniclaw-browser-cli
        PRODUCT_BUNDLE_IDENTIFIER: com.neartop.miniclaw.cli.browser

  miniclaw-ios-cli:
    type: tool
    platform: macOS
    sources:
      - path: MiniClawCLI/Common/CLICommon.swift
      - path: MiniClawCLI/iOS/main.swift
    settings:
      base:
        PRODUCT_NAME: miniclaw-ios-cli
        PRODUCT_BUNDLE_IDENTIFIER: com.neartop.miniclaw.cli.ios

schemes:
  miniclaw-sessions-cli:
    build:
      targets:
        miniclaw-sessions-cli: all
  miniclaw-fs-cli:
    build:
      targets:
        miniclaw-fs-cli: all
  miniclaw-config-cli:
    build:
      targets:
        miniclaw-config-cli: all
  miniclaw-model-cli:
    build:
      targets:
        miniclaw-model-cli: all
  miniclaw-browser-cli:
    build:
      targets:
        miniclaw-browser-cli: all
  miniclaw-ios-cli:
    build:
      targets:
        miniclaw-ios-cli: all
